version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cms
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-db:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongopass
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongo --eval \"db.adminCommand('ping')\" --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    image: smart-clinic-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db
      - mongo-db
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-db:3306/cms?useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "rootpass"
      SPRING_DATA_MONGODB_URI: "mongodb://root:mongopass@mongo-db:27017/prescriptions?authSource=admin"
    restart: unless-stopped
